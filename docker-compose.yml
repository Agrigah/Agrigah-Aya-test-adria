# Lancement : docker compose up --build
services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [bank-net]

  discovery-service:
    build:
      context: .
      args:
        MODULE: discovery-service
    image: ${REGISTRY:-agrigah-aya}/discovery-service:${TAG:-latest}
    ports:
      - "8761:8761"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  config-service:
    build:
      context: .
      args:
        MODULE: config-service
    image: ${REGISTRY:-agrigah-aya}/config-service:${TAG:-latest}
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    image: ${REGISTRY:-agrigah-aya}/account-service:${TAG:-latest}
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  transaction-service:
    build:
      context: .
      args:
        MODULE: transaction-service
    image: ${REGISTRY:-agrigah-aya}/transaction-service:${TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      config-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  notification-consumer:
    build:
      context: .
      args:
        MODULE: notification-consumer
    image: ${REGISTRY:-agrigah-aya}/notification-consumer:${TAG:-latest}
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  chatbot-agent:
    build:
      context: .
      args:
        MODULE: chatbot-agent
    image: ${REGISTRY:-agrigah-aya}/chatbot-agent:${TAG:-latest}
    ports:
      - "8084:8084"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-missing-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ACCOUNT_MCP_URL: http://account-service:8081
      TRANSACTION_MCP_URL: http://transaction-service:8082
    depends_on:
      config-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

  gateway-service:
    build:
      context: .
      args:
        MODULE: gateway-service
    image: ${REGISTRY:-agrigah-aya}/gateway-service:${TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      EUREKA_PREFER_IP: "true"
    depends_on:
      config-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [bank-net]

networks:
  bank-net:
    driver: bridge


bank-ui:
  build:
    context: ./bank-ui
  image: ${REGISTRY:-agrigah-aya}/bank-ui:${TAG:-latest}
  ports:
    - "4200:80"
  depends_on:
    gateway-service:
      condition: service_healthy
  restart: unless-stopped
  networks: [bank-net]