server:
  port: 8081
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  graphql:
    path: /account-graphql
    graphiql:
      enabled: true
      path: /account-graphiql
  ai:
    mcp:
      server:
        name: account-mcp-server
        version: 1.0.0
        type: SYNC
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
