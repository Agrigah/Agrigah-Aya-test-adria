name: CI-CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-test:
    name: Compilation + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilation
        run: mvn -B -DskipTests clean compile
      - name: Tests
        run: mvn -B verify

  docker:
    name: Image ${{ matrix.module }}
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [config-service, discovery-service, gateway-service, account-service,
                 transaction-service, notification-consumer, chatbot-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login au registre (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.module }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.module }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement (schématique)
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Déploiement via SSH + docker compose
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          scp -i key -o StrictHostKeyChecking=no docker-compose.yml deploy@$HOST:/opt/bank/
          ssh -i key -o StrictHostKeyChecking=no deploy@$HOST \
            "cd /opt/bank && REGISTRY=ghcr.io/${OWNER} TAG=${{ github.sha }} docker compose pull && \
             REGISTRY=ghcr.io/${OWNER} TAG=${{ github.sha }} docker compose up -d"
